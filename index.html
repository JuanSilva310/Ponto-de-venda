<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santos InforPrint PDV</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0a0f1f;
    color: #4da3ff;
}

/* LOGIN */
#login {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #000814;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* ORIENTAÇÃO */
#rotateWarning {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: #000814;
    color: white;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* APP */
#app {
    display: none;
    padding: 10px;
}

/* LOGO */
#logo {
    width: 160px;
    height: auto;
    margin-bottom: 10px;
}

/* INPUTS */
input, button, select {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
}

/* LISTA */
#list {
    border: 1px solid #4da3ff;
    padding: 10px;
    height: 200px;
    overflow-y: auto;
    margin-top: 10px;
}

/* BLOCO PAGAMENTO */
.payBlock {
    border: 1px solid #4da3ff;
    padding: 10px;
    margin-top: 10px;
}

#fabAdd {
    position: fixed;
    top: 70px; /* ajustado pra ficar perto do topo como você mostrou */
    right: 20px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #4da3ff;
    color: #000;
    font-size: 28px;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 10px #4da3ff;
    z-index: 9999;
}

/* PAINEL FLUTUANTE */
#productPanel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 9998;
}

#panelBox {
    background: #0a0f1f;
    border: 1px solid #4da3ff;
    padding: 20px;
    width: 300px;
    border-radius: 10px;
}
button {
    transition: 0.1s;
}

button:active {
    transform: scale(0.96);
    opacity: 0.7;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>LOGIN OPERADOR</h2>
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>
</div>

<!-- ORIENTAÇÃO -->
<div id="rotateWarning">
⚠️ Este programa não e compatível com essa orientação por favor deite o dispositivo para usa-lo.
</div>

<!-- APP -->
<div id="app">

<img id="logo" src="logo.png" alt="Logo">

<h2>💙 Santos InforPrint PDV</h2>

<!-- CLIENTE -->
<div class="payBlock">
<h3>👤 Dados do Cliente</h3>

<input id="clientName" placeholder="Nome do cliente">
<input id="clientCPF" placeholder="CPF" inputmode="numeric">

</div>

<!-- PRODUTO -->
<h3> 📦 Produto </h3>
<input id="code" placeholder="Código produto">
<input id="qty" type="number" value="1" min="1" style="width:60px">
<button onclick="addItem()">Adicionar</button>

<!-- LISTA -->
<div id="list"></div>

<h3 id="total">Total: R$ 0,00</h3>

<!-- PAGAMENTOS MULTI -->
<div class="payBlock">
<h3>💳 Pagamentos múltiplos</h3>

<select id="payType" onchange="updatePaymentFields()">
<option>Dinheiro</option>
<option>Cartão</option>
<option>PIX</option>
<option>Permuta (produto)</option>
<option>Crédito Cliente</option>
</select>

<input
id="payValue"
type="number"
inputmode="decimal"
step="0.01"
min="0"
placeholder="Valor">
<button onclick="addPayment()">Adicionar pagamento</button>

<input
id="tradeProduct"
type="text"
placeholder="Produto Permutado"
style="display:none;">

<div id="payments"></div>
</div>

<!-- TROCA / DEVOLUÇÃO -->
<div class="payBlock">  
<h3>🔁 Troca / Devolução</h3>

<!-- produtos devolvidos (multi) -->
<div id="refundProducts"></div>

<input id="refundProduct" type="text" placeholder="Produto devolvido/trocado">

<button onclick="addRefundProduct()">Adicionar produto</button>

<br>

<select id="refundType" onchange="toggleRefundValue()">
    <option value="total">Estorno total</option>
    <option value="partial">Estorno parcial</option>
    <option value="none">Não há estorno</option>
</select>

<input 
id="refundValue" 
type="number" 
step="0.01" 
placeholder="Valor do estorno"
style="display:none;">

<button onclick="applyRefund()">Aplicar troca/devolução</button>

<div id="refundInfo"></div>  
</div>

<button onclick="finalize()">Finalizar Venda</button>

<button onclick="gerarPDF('cliente')">📄 Via Cliente (PDF)</button>

<button onclick="gerarPDF('loja')">🏪 Via Loja (PDF)</button>

</div>

<div id="productPanel">
    <div id="panelBox">

        <h3>📦 Novo Produto</h3>

        <input id="newCode" placeholder="Código">
        <input id="newName" placeholder="Nome">
        <input id="newPrice" placeholder="Preço">

        <br>

        <button onclick="saveProduct()">Salvar</button>

<button onclick="exportDB()">📤 Exportar</button>
<button onclick="document.getElementById('importFile').click()">📥 Importar</button>

<button onclick="closePanel()">Fechar</button>

<input type="file" id="importFile" style="display:none" onchange="importDB(event)">

    </div>
</div>

<script>
let cart = [];
let payments = [];
let refundItems = [];
let refundTotal = 0;


let products = JSON.parse(localStorage.getItem("products")) || {
    "A1B2C": {name:"Carregador Inova", price:25},
    "X9K4L": {name:"Cabo USB-C", price:8.5}
};


/* LOGIN */
function login(){
    if(document.getElementById("user").value === "JuanSantos"
    && document.getElementById("pass").value === "210223"){

        sessionStorage.setItem("logged", "true");

        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
    } else alert("Erro login");
}


/* CARRINHO */
function addItem(){
    let code = document.getElementById("code").value;
    let qty = parseInt(document.getElementById("qty").value || 1);

    let p = products[code];
    if(!p) return alert("Produto não encontrado");

    for(let i=0; i<qty; i++){
        cart.push(p);
    }

    render();

    document.getElementById("code").value = "";
    document.getElementById("qty").value = 1;
    document.getElementById("code").focus();
}
/* RENDER */
function render(){
    let list = document.getElementById("list");
    list.innerHTML = "";
    let total = 0;

    cart.forEach((i,idx)=>{
        total += i.price;
        list.innerHTML += `
        ${i.name} - R$ ${i.price.toFixed(2)}
        <button onclick="cart.splice(${idx},1);render()">X</button><br>`;
    });

    document.getElementById("total").innerText = "Total: R$ " + total.toFixed(2);
}

/* PAGAMENTOS MÚLTIPLOS */
function addPayment(){
    let type = document.getElementById("payType").value;
    let value = parseFloat(document.getElementById("payValue").value || 0);

    payments.push({
    type,
    value,
    product: document.getElementById("tradeProduct").value
});

    document.getElementById("payments").innerHTML += 
    `${type}: R$ ${value.toFixed(2)}<br>`;
document.getElementById("payValue").value = "";
document.getElementById("tradeProduct").value = "";
document.getElementById("payType").selectedIndex = 0;

updatePaymentFields();

}

/* DEVOLUÇÃO */

function addRefundProduct(){
    let p = document.getElementById("refundProduct").value;
    if(!p) return alert("Informe o produto");

    refundItems.push(p);

    document.getElementById("refundProducts").innerHTML +=
    `• ${p}<br>`;

    document.getElementById("refundProduct").value = "";
}

function toggleRefundValue(){
    let type = document.getElementById("refundType").value;
    let field = document.getElementById("refundValue");

    if(type === "partial"){
        field.style.display = "block";
    } else {
        field.style.display = "none";
        field.value = "";
    }
}

function applyRefund(){
    let type = document.getElementById("refundType").value;

    let value = 0;

    if(type === "total"){
        value = cart.reduce((a,b)=>a+b.price,0);
    }

    if(type === "partial"){
        value = parseFloat(document.getElementById("refundValue").value || 0);
    }

    if(type === "none"){
        value = 0;
    }

    refundTotal += value;

    document.getElementById("refundInfo").innerHTML =
    `
    Tipo: ${type}<br>
    Produtos: ${refundItems.join(", ")}<br>
    Estorno aplicado: R$ ${value.toFixed(2)}
    `;
}

/* FINALIZAR */
function finalize(){
    let total = cart.reduce((a,b)=>a+b.price,0) - refundTotal;

    alert(
        "Venda finalizada\nTotal final: R$ " + total.toFixed(2)
    );

    cart = [];
    payments = [];
    refundTotal = 0;

    render();
    document.getElementById("payments").innerHTML = "";
    document.getElementById("refundInfo").innerHTML = "";
}

/* ORIENTAÇÃO */
function check(){
    const isPortrait = window.innerHeight > window.innerWidth;
    const logged = sessionStorage.getItem("logged") === "true";

    if(isPortrait){
        document.getElementById("rotateWarning").style.display = "flex";
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "none";
        return;
    }

    document.getElementById("rotateWarning").style.display = "none";

    if(logged){
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
    } else {
        document.getElementById("login").style.display = "flex";
        document.getElementById("app").style.display = "none";
    }
}
window.addEventListener("resize", check);
window.addEventListener("load", check);

function openPanel(){
    document.getElementById("productPanel").style.display = "flex";
}

function closePanel(){
    document.getElementById("productPanel").style.display = "none";
}

/* salvar direto no banco permanente (localStorage) */
function saveProduct(){
    let code = document.getElementById("newCode").value;
    let name = document.getElementById("newName").value;
    let price = parseFloat(document.getElementById("newPrice").value);

    if(!code || !name || isNaN(price)){
        alert("Preencha tudo corretamente");
        return;
    }

    products[code] = {name:name, price:price};
    localStorage.setItem("products", JSON.stringify(products));

    alert("Produto salvo no banco!");

    document.getElementById("newCode").value = "";
    document.getElementById("newName").value = "";
    document.getElementById("newPrice").value = "";

    closePanel();
}


function exportDB(){
    let data = localStorage.getItem("products");

    if(!data){
        alert("Nada para exportar");
        return;
    }

    let blob = new Blob([data], {type: "application/json"});
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "pdv-products-db.json";
    a.click();

    URL.revokeObjectURL(url);
}


function importDB(event){
    let file = event.target.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(e){
        try {
            let data = JSON.parse(e.target.result);

            products = data;
            localStorage.setItem("products", JSON.stringify(products));

            alert("Banco importado com sucesso!");
        } catch(err){
            alert("Arquivo inválido");
        }
    };

    reader.readAsText(file);
}

function gerarPDF(tipo){
const { jsPDF } = window.jspdf;
const doc = new jsPDF({orientation: "portrait",unit: "mm",format: "a5"});
let y = 10;  
let logo = new Image();  
logo.src = "logoPDF.png";  

function line(){  
    doc.setFontSize(10);  
    doc.setDrawColor(0, 0, 0);
doc.setLineWidth(0.6);
doc.line(10, y, 140, y);
doc.setLineWidth(0.2);
    y += 3;  
}  

function build(){  
doc.setTextColor(0, 0, 0);
doc.setDrawColor(0, 0, 0);
doc.setLineWidth(0.5);
doc.setFont(undefined, "normal");

    if(logo.complete && logo.naturalWidth > 0){  
        doc.addImage(logo, "PNG", 60, y, 30, 24);  
    }  
    // Espera a altura da logo terminar
y += 30;
    doc.setFontSize(14);
doc.setFont(undefined, "bold");
doc.text("SANTOS INFORPRINT", 40, y);
    y += 3;  
    doc.setFontSize(8);  
    doc.text("Comprovante de compra e venda comercial", 25, y);  
    y += 4;  
    doc.text(tipo === "cliente" ? "VIA CLIENTE" : "VIA LOJA", 35, y);  
    y += 4;  
    line();  
   
let clientName = document.getElementById("clientName").value || "Não informado";

let clientCPF = document.getElementById("clientCPF").value.replace(/\D/g, "");

if(clientCPF.length === 11){
    clientCPF = clientCPF.replace(
        /(\d{3})(\d{3})(\d{3})(\d{2})/,
        "$1.$2.$3-$4"
    );
}else if(clientCPF.length === 0){
    clientCPF = "Não informado";
}

doc.text("Cliente: " + clientName, 10, y);
y += 3;
doc.text("CPF: " + clientCPF, 10, y);
y += 4;
   
 line();  
    doc.text("PRODUTOS", 10, y); y += 4;  
    let subtotal = 0;  
    cart.forEach(item => {  
        subtotal += item.price;  
        doc.text(item.name, 10, y);  
        doc.text(`R$ ${item.price.toFixed(2)}`, 120, y);  
        y += 3;  
    });  
    y += 2; line();  
    let total = subtotal - refundTotal;  
    doc.text("Subtotal:", 10, y); doc.text(`R$ ${subtotal.toFixed(2)}`, 120, y); y += 3;  
    doc.text("🔁 DEVOLUÇÕES / TROCAS", 10, y);
y += 4;

if(refundItems.length === 0){
    doc.text("Nenhuma devolução registrada", 10, y);
    y += 4;
} else {

    doc.text("Produtos devolvidos:", 10, y);
    y += 3;

    refundItems.forEach(p => {
        doc.text("- " + p, 12, y);
        y += 3;
    });

    doc.text("Tipo de estorno:", 10, y);
    y += 3;

    doc.text(document.getElementById("refundType").value, 12, y);
    y += 4;

    doc.text("Valor do estorno:", 10, y);
    doc.text(`R$ ${refundTotal.toFixed(2)}`, 120, y);
    y += 5;
}
    doc.setFontSize(12); 
doc.setFont(undefined, "bold");
    doc.text("TOTAL:", 10, y); doc.text(`R$ ${total.toFixed(2)}`, 120, y); y += 5;  
    doc.setFontSize(8);  
doc.setFont(undefined, "bold");
    line();  
    doc.text("FORMA DE PAGAMENTO:", 10, y);
y += 6;

let validPayments = payments.filter(p => p.value > 0);

let totalRecebido = 0;

validPayments.forEach(p=>{
    totalRecebido += p.value;
});

let diferenca = totalRecebido - total;

if(validPayments.length === 0){
    doc.text("Nenhum pagamento registrado", 10, y);
    y += 3;
} else {
    validPayments.forEach(p => {
        doc.text(`${p.type}: R$ ${p.value.toFixed(2)}`, 10, y);
        y += 3;

        if(p.product){
            doc.text("Produto: " + p.product, 15, y);
            y += 3;
        }
    });
}
    y += 4; line();  

line();

doc.setFontSize(8);
doc.text("RESUMO FINANCEIRO",10,y);
y += 5;

doc.text("Total recebido:",10,y);
doc.text(`R$ ${totalRecebido.toFixed(2)}`,120,y);
y += 4;

if(diferenca > 0){

    doc.text("Troco:",10,y);
    doc.text(`R$ ${diferenca.toFixed(2)}`,120,y);

}else if(diferenca < 0){

    doc.text("Valor restante:",10,y);
    doc.text(`R$ ${Math.abs(diferenca).toFixed(2)}`,120,y);

}else{

    doc.text("Pagamento exato",10,y);

}

y += 5;


doc.setFontSize(8);
doc.text("INFORMAÇÕES DA COMPRA", 10, y);
y += 4;

doc.setFontSize(7);
doc.setFont(undefined, "bold");
doc.text("Empresa: Santos InforPrint", 10, y);
y += 3;

doc.text("Endereço: Rua José Luiz da Silva, 1112", 10, y);
y += 3;

doc.text("Contato: (81) 99616-8545", 10, y);
y += 3;

doc.text("Comprovante válido.", 10, y);
y += 3;

doc.text("Código: 004B567ADG09H", 10, y);
y += 4;

line();

doc.setFontSize(7);
doc.setFont(undefined, "bold");
doc.text("Este documento é um comprovante de compra e venda comercial", 10, y);
y += 3;
doc.text("e não substitui documento fiscal.", 10, y);
y +=3;
const agora = new Date();

const dataHora =
agora.toLocaleDateString("pt-BR") +
" " +
agora.toLocaleTimeString("pt-BR");

doc.setFontSize(7);
doc.text("Emitido em: " + dataHora, 10, y);
y += 3;

doc.save(`Santos_InforPrint_${tipo}.pdf`);

}  

logo.onload = build;
logo.onerror = build;
}
window.addEventListener("load", () => {
    check();
});

function updatePaymentFields(){

    let tipo = document.getElementById("payType").value;

    let campo = document.getElementById("tradeProduct");

    if(tipo === "Permuta (produto)"){
        campo.style.display = "block";
    }else{
        campo.style.display = "none";
        campo.value = "";
    }

}
window.addEventListener("keydown", function(e){

    // F12 abre/fecha painel produto
    if(e.key === "F12"){
        e.preventDefault();
        let panel = document.getElementById("productPanel");
        panel.style.display = (panel.style.display === "flex") ? "none" : "flex";

        document.getElementById("newCode").focus();
    }

    // SHIFT + F1 import
    if(e.shiftKey && e.key === "F1"){
        document.getElementById("importFile").click();
    }

    // SHIFT + F2 export
    if(e.shiftKey && e.key === "F2"){
        exportDB();
    }

    // F1 vai pra devolução
if(e.altKey && e.key === "F1"){
    e.preventDefault();
    document.getElementById("refundProduct").focus();
}

    // CTRL + ENTER = PDF CLIENTE
    if(e.ctrlKey && e.key === "Enter"){
        gerarPDF("cliente");
    }

    // SHIFT + ENTER = PDF LOJA
    if(e.shiftKey && e.key === "Enter"){
        gerarPDF("loja");
    }

});

/* =========================
   ATALHOS TECLADO (ENTER)
========================= */

window.addEventListener("load", () => {

    check();

    /* PRODUTO */
    document.getElementById("code").addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault();
            document.getElementById("qty").focus();
        }
    });

        if(e.key === "Enter"){
            e.preventDefault();

        }
    });

    document.getElementById("payValue").addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault();
            addPayment();
        }
    });

    /* DEVOLUÇÃO */
    document.getElementById("refundProduct").addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault();
            addRefundProduct();
        }
    });

    document.getElementById("refundValue").addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault();
            applyRefund();
        }
    });

    /* CADASTRO */
    document.getElementById("newCode").addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault();
            document.getElementById("newName").focus();
        }
    });

    document.getElementById("newName").addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault();
            document.getElementById("newPrice").focus();
        }
    });

    document.getElementById("newPrice").addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault();
            saveProduct();
        }
    });

    /* LOGIN */
    document.getElementById("pass").addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault();

        }
    });

document.getElementById("clientName").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        document.getElementById("clientCPF").focus();
    }
});

document.getElementById("clientCPF").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        document.getElementById("code").focus(); // vai pro PDV
    }
});


document.getElementById("clientCPF").addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 11);
});

});


</script>
